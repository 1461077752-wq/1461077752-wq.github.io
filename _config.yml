# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.

title: 我的技术博客
email: 1461077752-wq@users.noreply.github.com
description: >-
  分享技术文章和学习心得,记录编程成长之路
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://1461077752-wq.github.io" # the base hostname & protocol for your site
github_username: 1461077752-wq

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .idea/
  - .vscode/

# Custom settings
show_excerpts: true
date_format: "%Y-%m-%d"

# Pagination
paginate: 10
paginate_path: "/page:num/"
